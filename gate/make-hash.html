<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Хэш пароля</title>
<body style="font-family:system-ui;max-width:560px;margin:40px auto;padding:0 16px">
<h2>Хэш пароля для gate.js</h2>
<p>Введите пароль — получите строку для <code>data-hash</code>. Всё считается в браузере, пароль никуда не отправляется.</p>
<input id="p" type="text" placeholder="новый пароль" style="width:100%;padding:10px;font-size:16px">
<p><textarea id="o" readonly style="width:100%;height:70px;font-family:monospace"></textarea></p>
<script>p.oninput=async()=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p.value));o.value=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}</script>
</body></html>
