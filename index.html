<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вселенные Вентян — выберите сайт</title>
<style>
:root{color-scheme:dark;--ink:#f5eaff;--mu:#b9a3d6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font:400 16px/1.5 'Onest',system-ui,sans-serif;
 background:radial-gradient(circle at 15% 10%,#6a2fd055,transparent 50%),radial-gradient(circle at 90% 90%,#ff4fa344,transparent 50%),#0d0518}
header{text-align:center;padding:70px 18px 30px}header h1{margin:0;font-size:clamp(28px,6vw,52px);font-family:'Unbounded',system-ui,sans-serif}
header p{color:var(--mu);max-width:34em;margin:12px auto 0}
.grid{max-width:1000px;margin:0 auto;padding:20px 18px 90px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
a.u{display:flex;flex-direction:column;gap:8px;min-height:230px;padding:24px;border-radius:24px;color:#fff;text-decoration:none;position:relative;overflow:hidden;
 background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 18px 40px -20px #000;transition:transform .25s,box-shadow .25s}
a.u:hover{transform:translateY(-5px);box-shadow:0 22px 50px -16px var(--c1)}
a.u.off{pointer-events:none;filter:saturate(.5) brightness(.7)}
.u .e{font-size:54px;line-height:1}.u h2{margin:auto 0 0;font-size:22px}.u p{margin:0;opacity:.85;font-size:14px}
.u .st{position:absolute;top:16px;right:16px;font-size:12px;font-weight:600;background:#0005;border-radius:999px;padding:3px 11px}
footer{text-align:center;color:var(--mu);font-size:13px;padding-bottom:30px}
</style></head><body>
<header><h1>✦ Вселенные Вентян</h1><p>Выберите, куда отправиться: звёздная новелла, история Пэлле и Васи или другая вселенная. Закрытые миры открываются паролем автора.</p></header>
<main class="grid" id="g"></main><footer>© Вентян</footer>
<script src="hub/universes.js"></script>
<script>
g.innerHTML=UNIVERSES.map(u=>`<a class="u ${u.url?'':'off'}" href="${u.url||'#'}" style="--c1:${u.c1};--c2:${u.c2}">
 <span class="st">${u.locked?'🔒 ':''}${u.status}</span><span class="e">${u.emoji}</span><h2>${u.title}</h2><p>${u.tag}</p></a>`).join('')
</script></body></html>
